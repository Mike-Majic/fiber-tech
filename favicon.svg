<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Fiber Tech favicon</title>
  <desc id="desc">Icona Fiber Tech con monogramma F e filamenti di fibra ottica arancioni su fondo scuro.</desc>
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#24242a"/>
      <stop offset="62%" stop-color="#101014"/>
      <stop offset="100%" stop-color="#050507"/>
    </radialGradient>
    <linearGradient id="fiber" x1="8" y1="54" x2="56" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff7a00"/>
      <stop offset="52%" stop-color="#ffb15c"/>
      <stop offset="100%" stop-color="#ff7a00"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#bgGlow)"/>
  <path d="M8 48 C21 36, 33 26, 56 14" fill="none" stroke="#ff7a00" stroke-width="2.8" stroke-linecap="round" opacity="0.45"/>
  <path d="M10 55 C24 43, 39 30, 58 22" fill="none" stroke="url(#fiber)" stroke-width="3.6" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M10 42 C22 34, 34 21, 52 8" fill="none" stroke="#ff9a34" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
  <circle cx="13" cy="53" r="3.2" fill="#ff7a00" filter="url(#glow)"/>
  <circle cx="57" cy="22" r="2.4" fill="#ffd0a0" filter="url(#glow)"/>

  <path d="M22 17h25v8H31v7h14v8H31v15h-9V17Z" fill="#f5f5f5"/>
  <path d="M31 25h16v-8H22v38h9V40h14v-8H31v-7Z" fill="#ffffff" opacity="0.95"/>
</svg>
